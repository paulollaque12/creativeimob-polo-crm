<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@300;400;500;600&display=swap">
<style>
/* Layout: palco 1920x1080 escalado para caber na tela (TV), sem barra nem filtros. Visual único escuro. */
:root{
  color-scheme:dark;
  --bg:#050506; --bar:#0f0f10; --barline:#222224; --fg:#efedea; --mut:#8f8b86;
  --red:#b0121c; --red2:#e2353e; --up:#3ccf82; --down:#ff6b57;
  --gold:#d4b46a; --silver:#c2c5cb; --bronze:#c48a5c;
  --gold-l:#b38a2e; --silver-l:#9298a1; --bronze-l:#a5683e;
  --sora:Sora,system-ui,sans-serif; --man:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--man);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.tb{flex:none;display:flex;align-items:center;gap:20px;height:56px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--barline)}
.tb .lbl{font:600 12px/1 var(--sora);letter-spacing:.2em;color:var(--mut);white-space:nowrap}
.seg{display:flex;gap:4px;padding:4px;background:#18181a;border-radius:10px}
.seg button{all:unset;cursor:pointer;padding:9px 16px;border-radius:7px;font:600 14px/1 var(--man);color:var(--mut);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:#0b0b0c}
.seg button:hover:not([aria-pressed="true"]){color:var(--fg)}
.seg button:focus-visible{outline:2px solid var(--red2)}
.tb .nm{font:500 13px/1 var(--man);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--barline);border-radius:8px;font:600 13px/1 var(--man);color:var(--fg);white-space:nowrap}
.tbtn:hover{border-color:#3a3a3d}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.tbtn:focus-visible{outline:2px solid var(--red2)}
.stagewrap{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.full .tb{display:none}
@media (max-width:760px){.tb .nm,.tb .lbl{display:none}.tb{gap:10px}.seg button{padding:8px 10px}}
#stage .st{animation:entra .7s ease both}
@keyframes entra{from{opacity:0}to{opacity:1}}
.rot{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid #262628;border-radius:999px}
.rot span{position:relative;overflow:hidden;padding:13px 24px;border-radius:999px;font:600 18px/1 var(--man);color:#77736e}
.rot span.on{background:#f2f0ed;color:#0b0b0c}
.rot span.on i{position:absolute;left:0;bottom:0;height:3px;background:var(--red);animation:corre var(--dur,60s) linear both}
@keyframes corre{from{width:0}to{width:100%}}
body.ocioso{cursor:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- peças comuns do palco ---------- */
.st{width:1920px;height:1080px;overflow:hidden;position:relative}
.mono{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;position:relative;flex:none}
.mono i{display:block}
.mono i.k{background:#000;box-shadow:inset 0 0 0 1px #2c2c2e}
.mono i.r{background:#b0121c}
.mono b{position:absolute;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--sora);font-weight:600;color:#151515}
.mono b span{color:#b0121c}
.av{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sora);font-weight:500;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.av.d{background:linear-gradient(160deg,#2b2b2e,#161618);color:#77736e;box-shadow:inset 0 0 0 1px #2e2e31}
.av.l{background:linear-gradient(160deg,#e4e1dc,#cfcbc5);color:#8d8984}
.mv{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-family:var(--man);font-weight:700;white-space:nowrap}
.mv.up{background:rgba(60,207,130,.12);color:var(--up)}
.mv.down{background:rgba(255,107,87,.12);color:var(--down)}
.mv.eq{background:#1e1e20;color:#8f8b86}
.mv.novo{border:1px solid #5a5a5e;color:#d8d5d0;letter-spacing:.14em}
.cup{flex:none}
.pill{all:unset;cursor:pointer;white-space:nowrap}
.pill:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums lining-nums}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:0 200px}
.empty h2{margin:0;font:600 44px/1.1 var(--sora)}
.empty p{margin:0;font:500 22px/1.4 var(--man);color:var(--mut)}
.empty .go{all:unset;cursor:pointer;margin-top:12px;padding:16px 26px;border-radius:12px;background:var(--fg);color:#0b0b0c;font:700 20px/1 var(--man)}
.skel{background:linear-gradient(90deg,#141416,#1e1e20,#141416);background-size:200% 100%;animation:sk 1.4s infinite linear;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
</style>

<script>
/* Polo · versão estática (GitHub Pages)
   Lê o arquivo cifrado (AES-GCM, chave PBKDF2-SHA256; opcionalmente comprimido com zlib),
   pede a senha uma vez e a guarda neste aparelho (a mesma para o ranking e o painel).
   Configuração opcional em window.__poloCfg = { alvo: seletor, tela: function (erro) { return html } }:
   a tela precisa ter um <form id="fsenha"> com um <input id="isenha">. Sem configuração, usa a tela do ranking da TV. */
(function () {
  var CHAVE = 'polo-tv-senha';
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function decifrar(pkg, senha) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(pkg.salt), iterations: pkg.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    if (pkg.z && typeof DecompressionStream === 'undefined') throw new Error('sem DecompressionStream');
    var claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(pkg.iv) }, key, b64(pkg.ct));
    var texto = pkg.z
      ? await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('deflate'))).text()
      : new TextDecoder().decode(claro);
    return JSON.parse(texto);
  }
  // Painel (lembrar:false): senha só nesta aba, pedida a cada abertura. TV: fica salva no aparelho.
  function loja() { var c = window.__poloCfg || {}; return c.lembrar === false ? sessionStorage : localStorage; }
  if ((window.__poloCfg || {}).lembrar === false) { try { localStorage.removeItem(CHAVE); } catch (e) {} }
  function lerSenha() { try { return loja().getItem(CHAVE); } catch (e) { return null; } }
  function guardar(s) { try { loja().setItem(CHAVE, s); } catch (e) {} }
  function esquecer() { try { loja().removeItem(CHAVE); } catch (e) {} }
  function telaTV(erro) {
    return '<div class="st" style="background:#0b0b0c;color:#f2f0ed;display:flex;align-items:center;justify-content:center">' +
      '<form id="fsenha" style="width:640px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center">' +
        '<div class="mono" aria-hidden="true" style="width:72px;height:72px"><i class="k"></i><i class="r"></i><i class="r"></i><i class="k"></i><b style="inset:18px;font-size:19px">P<span>R</span></b></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><h1 style="margin:0;font:600 48px/1.1 var(--sora);letter-spacing:-.02em">Top Corretores</h1>' +
        '<p style="margin:0;font:500 21px/1.4 var(--man);color:#8f8b86">Digite a senha da Polo para abrir o ranking. Ela fica salva nesta tela.</p></div>' +
        '<label for="isenha" style="position:absolute;left:-9999px">Senha</label>' +
        '<input id="isenha" type="password" autocomplete="current-password" style="width:100%;height:72px;padding:0 24px;border-radius:14px;border:1px solid #2c2c2f;background:#151517;color:#f2f0ed;font:600 26px var(--man);text-align:center;letter-spacing:.08em">' +
        (erro ? '<p role="alert" style="margin:-8px 0 0;font:600 19px var(--man);color:#ff6b57">Senha incorreta. Tente de novo.</p>' : '') +
        '<button type="submit" style="all:unset;cursor:pointer;width:100%;height:72px;border-radius:14px;background:#b0121c;color:#fff;font:700 24px/72px var(--man);text-align:center">Entrar</button>' +
      '</form></div>';
  }
  function pedirSenha(pkg, erro) {
    var cfg = window.__poloCfg || {};
    return new Promise(function (ok) {
      var alvo = document.querySelector(cfg.alvo || '#stage');
      alvo.innerHTML = (cfg.tela || telaTV)(erro);
      if (erro === 'nav') alvo.querySelector('#fsenha').insertAdjacentHTML('beforeend', '<p class="er" role="alert" style="color:#ff6b57">Este navegador não conseguiu abrir os dados. Atualize o navegador ou use Chrome, Edge ou Safari recente.</p>');
      var inp = document.getElementById('isenha'); setTimeout(function () { inp.focus(); }, 50);
      document.getElementById('fsenha').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var s = inp.value; if (!s) return;
        decifrar(pkg, s).then(function (d) { guardar(s); ok(d); }).catch(function (e) {
          // OperationError = senha errada; qualquer outro erro é limitação do navegador
          pedirSenha(pkg, e && e.name === 'OperationError' ? true : 'nav').then(ok);
        });
      });
    });
  }
  window.__poloFonte = async function () {
    var r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    var pkg = await r.json();
    if (/[?&#]sair\b/.test(location.href)) esquecer();   // ?sair apaga a senha salva neste navegador
    var s = lerSenha();
    if (s) { try { return await decifrar(pkg, s); } catch (e) { esquecer(); } }
    return pedirSenha(pkg, false);
  };
})();

</script>
<script>
// ===== Motor de cálculo do Dashboard Polo (puro, sem DOM) =====
var E0 = Date.UTC(2025, 0, 1);            // dia 0 do cubo
var DAY = 86400000;
var MET = [
  { k: 'leads', n: 'Leads', s: 'Leads captados' },
  { k: 'c1', n: '1º Contato' },
  { k: 'pre', n: 'Pré-atendimento' },
  { k: 'atd', n: 'Atendimento' },
  { k: 'agd', n: 'Agendamento' },
  { k: 'vis', n: 'Visita' },
  { k: 'prop', n: 'Proposta' },
  { k: 'vend', n: 'Venda' },
  { k: 'agc', n: 'Agenciamentos' },
  { k: 'pla', n: 'Placas' }
];
var FUNIL = [0, 1, 2, 3, 4, 5, 6, 7];

function dIdx(iso) { var p = iso.split('-'); return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - E0) / DAY); }
function dIso(i) { return new Date(E0 + i * DAY).toISOString().slice(0, 10); }
function dObj(i) { return new Date(E0 + i * DAY); }
var INICIO = dIdx('2026-01-01');          // primeiro dia com dados no cubo

// Converte o resultado da consulta (linhas k, n, s) no cubo em memória
function parseCubo(rows) {
  var C = { m: [], k: {}, ref: null };
  for (var i = 0; i < 10; i++) C.m[i] = [];
  rows.forEach(function (r) {
    var k = r[0], s = r[2] || '';
    if (k === 'ref') { C.ref = s; return; }
    if (k.indexOf('k_') === 0) { C.k[k.slice(2)] = [''].concat(s.split('\t')); return; }
    var m = +k.slice(1);
    if (!s) return;
    C.m[m] = s.split(';').map(function (t) {
      var a = t.split('|');
      return { d: +a[0], x: a[1], r: a[2] ? +a[2] : 0, v: a[3] ? +a[3] : 0, b: a[4] ? +a[4] : 0, t: a[5] ? +a[5] : 0,
        q: a[6] === '' ? null : +a[6], a: a[7] === '' ? null : +a[7], imo: a[8], val: a[9] === '' ? 0 : +a[9] };
    });
  });
  return C;
}

function faixaArea(a) {
  if (a == null || a <= 0) return 'Sem informação';
  if (a < 80) return 'Até 80 m²';
  if (a < 120) return '80 a 120 m²';
  if (a < 160) return '120 a 160 m²';
  if (a < 220) return '160 a 220 m²';
  if (a < 300) return '220 a 300 m²';
  return '300 m² ou mais';
}
var AREA_ORD = ['Até 80 m²', '80 a 120 m²', '120 a 160 m²', '160 a 220 m²', '220 a 300 m²', '300 m² ou mais', 'Sem informação'];
function faixaDorm(q) { if (q == null || q <= 0) return 'Sem informação'; return q >= 4 ? '4 ou mais' : q + (q === 1 ? ' dormitório' : ' dormitórios'); }

var DIMS = [
  { k: 'cor', n: 'Corretor', f: function (C, e) { return C.k.cor[e.r] || 'Sem corretor'; } },
  { k: 'vei', n: 'Veículo de captação', f: function (C, e) { return normVei(C.k.vei[e.v]) || 'Sem informação'; }, semImovel: true },
  { k: 'bai', n: 'Bairro', f: function (C, e) { return C.k.bai[e.b] || 'Sem informação'; } },
  { k: 'cat', n: 'Tipologia', f: function (C, e) { return C.k.cat[e.t] || 'Sem informação'; } },
  { k: 'dor', n: 'Dormitórios', f: function (C, e) { return faixaDorm(e.q); } },
  { k: 'are', n: 'Área privativa', f: function (C, e) { return faixaArea(e.a); }, ord: AREA_ORD }
];
function dimBy(k) { for (var i = 0; i < DIMS.length; i++) if (DIMS[i].k === k) return DIMS[i]; }
// Une grafias diferentes do mesmo veículo
function normVei(s) {
  if (!s) return s;
  var l = s.toLowerCase();
  if (l === 'youtube') return 'YouTube';
  return s;
}

// F = {cor: id|0, vei: nome|''}
function passa(C, m, e, F) {
  if (F.cor && e.r !== F.cor) return false;
  if (F.vei) { if (m >= 8) return false; if (normVei(C.k.vei[e.v]) !== F.vei) return false; }
  return true;
}
function linhas(C, m, d1, d2, F) {
  var out = [], L = C.m[m];
  for (var i = 0; i < L.length; i++) { var e = L[i]; if (e.d >= d1 && e.d <= d2 && passa(C, m, e, F)) out.push(e); }
  return out;
}
function distintos(L) { var s = {}, n = 0; for (var i = 0; i < L.length; i++) if (!s[L[i].x]) { s[L[i].x] = 1; n++; } return n; }
// VGV: um valor por imóvel vendido (regra do Power BI); vendas = negócios distintos
function vgv(L) {
  var p = {}, t = 0;
  for (var i = 0; i < L.length; i++) { var e = L[i], k = e.imo || ('n' + e.x); if (!(k in p) || e.val > p[k]) p[k] = e.val; }
  for (var k in p) t += p[k];
  return t;
}
function medida(C, m, d1, d2, F) { return distintos(linhas(C, m, d1, d2, F)); }
function funil(C, d1, d2, F) {
  var o = {};
  FUNIL.forEach(function (m) { o[m] = medida(C, m, d1, d2, F); });
  var lv = linhas(C, 7, d1, d2, F);
  o.vgv = vgv(lv); o.ticket = o[7] ? o.vgv / o[7] : 0;
  o[8] = medida(C, 8, d1, d2, F); o[9] = medida(C, 9, d1, d2, F);
  return o;
}
// Período anterior: os N dias imediatamente antes
function anterior(d1, d2) { var n = d2 - d1 + 1; return [d1 - n, d1 - 1]; }
function variacao(a, b, d1prev) {
  if (d1prev < INICIO || !b) return null;   // período anterior antes do início dos dados = sem base
  return (a - b) / b;
}
// Agrupa uma métrica por dimensão: [{nome, n, vend, vgv}]
function porDim(C, m, d1, d2, F, dk) {
  var dim = dimBy(dk), g = {};
  linhas(C, m, d1, d2, F).forEach(function (e) { var k = dim.f(C, e); (g[k] = g[k] || []).push(e); });
  return Object.keys(g).map(function (k) { return { nome: k, n: distintos(g[k]), L: g[k] }; });
}
// Séries temporais: granularidade dia/semana/mês/ano
function serie(C, m, d1, d2, F, gran, valor) {
  var L = linhas(C, m, d1, d2, F), b = {}, keys = [];
  function chave(i) {
    var o = dObj(i);
    if (gran === 'dia') return i;
    if (gran === 'sem') { var w = (o.getUTCDay() + 6) % 7; return Math.max(i - w, d1); }
    if (gran === 'ano') return Date.UTC(o.getUTCFullYear(), 0, 1);
    return Date.UTC(o.getUTCFullYear(), o.getUTCMonth(), 1);
  }
  for (var i = d1; i <= d2; i++) { var k = chave(i); if (!b[k]) { b[k] = []; keys.push(k); } }
  L.forEach(function (e) { b[chave(e.d)].push(e); });
  return keys.map(function (k) { return { k: k, v: valor === 'vgv' ? vgv(b[k]) : distintos(b[k]) }; });
}
// Semanas do mês, de segunda a domingo, recortadas no mês (W1..Wn)
function semanasMes(ano, mes) {
  var d1 = dIdx(ano + '-' + String(mes).padStart(2, '0') + '-01');
  var fim = new Date(Date.UTC(ano, mes, 0)).getUTCDate(), d2 = d1 + fim - 1, out = [], ini = d1;
  for (var i = d1; i <= d2; i++) {
    var dow = (dObj(i).getUTCDay() + 6) % 7;
    if (dow === 6 || i === d2) { out.push([ini, i]); ini = i + 1; }
  }
  return out;
}
var fmt = {
  n: function (v) { return Math.round(v).toLocaleString('pt-BR'); },
  dec: function (v) { return v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); },
  pct: function (v, dec) { return (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }) + '%'; },
  mi: function (v) { return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Mi'; },
  brl: function (v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }); },
  data: function (i) { var o = dObj(i); return String(o.getUTCDate()).padStart(2, '0') + '/' + String(o.getUTCMonth() + 1).padStart(2, '0') + '/' + o.getUTCFullYear(); }
};
if (typeof module !== 'undefined') module.exports = { parseCubo: parseCubo, funil: funil, porDim: porDim, vgv: vgv, linhas: linhas, distintos: distintos, dIdx: dIdx, serie: serie, semanasMes: semanasMes, fmt: fmt, MET: MET };

<script>
var SQL = "/*polo-tv v3 · TV: rankings + fotos do Vista; a última linha (zz) só faz o conector salvar o resultado em arquivo e é descartada pelo cifrar.py*/\nWITH\np AS (SELECT DATE_SUB(CURRENT_DATE('America/Sao_Paulo'), INTERVAL 1 DAY) L),\nper AS (\n  SELECT 'ano' k, DATE_TRUNC(L, YEAR) a, L b FROM p UNION ALL\n  SELECT 'mes', DATE_TRUNC(L, MONTH), L FROM p UNION ALL\n  SELECT 'mes_ant', DATE_SUB(DATE_TRUNC(L, MONTH), INTERVAL 1 MONTH),\n    LEAST(DATE_ADD(DATE_SUB(DATE_TRUNC(L, MONTH), INTERVAL 1 MONTH), INTERVAL DATE_DIFF(L, DATE_TRUNC(L, MONTH), DAY) DAY), DATE_SUB(DATE_TRUNC(L, MONTH), INTERVAL 1 DAY)) FROM p UNION ALL\n  SELECT 'sem', DATE_TRUNC(L, WEEK(MONDAY)), L FROM p UNION ALL\n  SELECT 'sem_ant', DATE_SUB(DATE_TRUNC(L, WEEK(MONDAY)), INTERVAL 7 DAY), DATE_SUB(L, INTERVAL 7 DAY) FROM p\n),\nlim AS (SELECT MIN(a) a0, MAX(b) b0 FROM per),\ng AS (\n  SELECT CodigoNegocio x, MIN(Data) d, ANY_VALUE(CodigoEmImovel) imo, MAX(valornegocio_dn) val, ARRAY_AGG(DISTINCT IFNULL(nome_usuario, '')) cors\n  FROM `vistaprocessos.nitro_dados.vw_consolidado_dados_polo`, lim\n  WHERE Assunto IN ('Negócio ganho', 'Negocio Ganho via API') AND Data BETWEEN DATE_SUB(a0, INTERVAL 40 DAY) AND b0\n  GROUP BY 1\n),\nu AS (SELECT codigo, ANY_VALUE(nome) nome FROM `vistaprocessos.nitro_dados.vista_usuarios` WHERE imobiliaria_id = 1005 GROUP BY 1),\nev AS (\n  SELECT 'leads' m, DATE(c.Data) d, c.nome_usuario cor, c.CodigoCliente x, CAST(NULL AS STRING) imo, CAST(NULL AS FLOAT64) val\n  FROM `vistaprocessos.nitro_dados.vw_consolidado_clientes_capturados_polo` c, lim\n  WHERE DATE(c.Data) BETWEEN a0 AND b0\n  UNION ALL\n  SELECT CASE WHEN EtapaAcaoId IN ('13','16') THEN 'atd' WHEN EtapaAcaoId = '14' THEN 'agd' ELSE 'vis' END, Data, nome_usuario, CodigoCliente, NULL, NULL\n  FROM `vistaprocessos.nitro_dados.vw_consolidado_dados_polo`, lim\n  WHERE Data BETWEEN a0 AND b0 AND EtapaAcaoId IN ('13','16','14','2')\n    AND (Assunto IS NULL OR Assunto NOT IN ('Negócio ganho','Negócio perdido'))\n  UNION ALL\n  SELECT 'vend', d, NULLIF(c, ''), x, imo, CAST(val AS FLOAT64) FROM g, UNNEST(cors) c, lim WHERE d BETWEEN a0 AND b0\n  UNION ALL\n  SELECT 'agc', DATE(i.data_cadastro), u.nome, i.codigo, NULL, NULL\n  FROM `vistaprocessos.nitro_dados.vista_imoveis` i LEFT JOIN u ON u.codigo = i.codigo_corretor, lim\n  WHERE i.imobiliaria_id = 1005 AND DATE(i.data_cadastro) BETWEEN a0 AND b0\n),\nj AS (\n  SELECT per.k, ev.m, ev.cor, ev.x, ev.imo, ev.val FROM per JOIN ev ON ev.d BETWEEN per.a AND per.b WHERE ev.cor IS NOT NULL\n  UNION ALL\n  SELECT per.k, ev.m, '*', ev.x, ev.imo, ev.val FROM per JOIN ev ON ev.d BETWEEN per.a AND per.b\n),\ncnt AS (SELECT k, m, cor, COUNT(DISTINCT x) n FROM j GROUP BY 1, 2, 3),\nvg AS (\n  SELECT k, 'vgv' m, cor, SUM(mx) v FROM (\n    SELECT k, cor, COALESCE(imo, CONCAT('n', x)) ik, MAX(val) mx FROM j WHERE m = 'vend' GROUP BY 1, 2, 3\n  ) GROUP BY 1, 2, 3\n),\nlin AS (\n  SELECT k, m, CONCAT(cor, '|', CAST(n AS STRING)) t FROM cnt\n  UNION ALL\n  SELECT k, m, CONCAT(cor, '|', CAST(CAST(ROUND(v) AS INT64) AS STRING)) FROM vg\n)\nSELECT k, m, STRING_AGG(t, ';' ORDER BY t) s FROM lin GROUP BY 1, 2\nUNION ALL\nSELECT k, '_per', CONCAT(CAST(a AS STRING), '|', CAST(b AS STRING)) FROM per\nUNION ALL\nSELECT '_foto', nome, ANY_VALUE(foto) FROM `vistaprocessos.nitro_dados.vista_usuarios`\nWHERE imobiliaria_id = 1005 AND foto IS NOT NULL AND foto != '' AND nome IS NOT NULL GROUP BY nome\nUNION ALL\nSELECT 'zz', '_pad', REPEAT('x', 300000)\n";
var SRV = "Google Cloud BigQuery";
// Fotos dos corretores: nome exatamente como no Vista -> imagem embutida (data URI). Vazio = moldura com iniciais.
var FOTOS = {};   // nome do corretor -> URL da foto no Vista (vem nos dados, linhas _foto)
var MT = [
  { k: 'leads', m: 0, n: 'Leads', t: 'Leads captados', un: ['lead', 'leads'] },
  { k: 'atd', m: 3, n: 'Atendimento', t: 'Atendimento', un: ['atendimento', 'atendimentos'] },
  { k: 'agd', m: 4, n: 'Agendamento', t: 'Agendamento', un: ['agendamento', 'agendamentos'] },
  { k: 'vis', m: 5, n: 'Visitas', t: 'Visitas', un: ['visita', 'visitas'] },
  { k: 'vend', m: 7, n: 'Vendas', t: 'Vendas', un: ['venda', 'vendas'] },
  { k: 'vgv', m: 7, n: 'VGV', t: 'VGV', vgv: true },
  { k: 'agc', m: 8, n: 'Agenciamentos', t: 'Agenciamentos', un: ['agenciamento', 'agenciamentos'] }
];
var PER = [{ k: 'ano', n: 'Anual' }, { k: 'mes', n: 'Mensal' }, { k: 'sem', n: 'Semanal' }];
var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
// Pedido do cliente (04/11/2026): sem filtros; mês atual; gira sozinho entre Leads, Visitas e Vendas a cada 60 s
var ROT = ['leads', 'vis', 'vend'], ROT_MS = 60000;
var S = { o: 1, mt: ROT[0], p: 'mes' };
var AG = null, QUANDO = null;
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- regras do ranking ---------- */
function metr() { for (var i = 0; i < MT.length; i++) if (MT[i].k === S.mt) return MT[i]; return MT[0]; }
function dd(i) { var o = dObj(i); return String(o.getUTCDate()).padStart(2, '0') + '/' + String(o.getUTCMonth() + 1).padStart(2, '0'); }
function periodo() {
  var Pd = AG.per, ano = Pd.ano, mes = Pd.mes, sem = Pd.sem;
  var L = dIdx(ano[1]), o = dObj(L), y = o.getUTCFullYear(), mth = o.getUTCMonth();
  if (S.p === 'ano') return { k: 'ano', comp: false, titulo: String(y), faixa: '01/01 a ' + dd(L) + ' · ranking do ano, sem comparação', curto: 'no ano' };
  if (S.p === 'mes') {
    var nomeMes = MESES[mth].charAt(0).toUpperCase() + MESES[mth].slice(1);
    return { k: 'mes', kp: 'mes_ant', comp: true, titulo: nomeMes + ' ' + y, faixa: dd(dIdx(mes[0])) + ' a ' + dd(L) + ' · vs. ' + dd(dIdx(Pd.mes_ant[0])) + ' a ' + dd(dIdx(Pd.mes_ant[1])) + ', mesmo nº de dias', curto: 'no mês', ant: MESES[(mth + 11) % 12].slice(0, 3) };
  }
  var s1 = dIdx(sem[0]);
  return { k: 'sem', kp: 'sem_ant', comp: true, titulo: 'Semana ' + dd(s1) + (L > s1 ? ' – ' + dd(L) : ''), faixa: 'vs. ' + dd(dIdx(Pd.sem_ant[0])) + (L > s1 ? ' – ' + dd(dIdx(Pd.sem_ant[1])) : '') + ', mesmos dias da semana anterior', curto: 'na semana', ant: 'sem. ant.' };
}
var FORA = /Exclu|Administrativo|Creative/i;
function ranking(mt, k) {
  var bloco = AG.d[k] || {}, vals = bloco[mt.vgv ? 'vgv' : mt.k] || {}, vend = bloco.vend || {};
  var out = Object.keys(vals).filter(function (nm) { return nm !== '*' && !FORA.test(nm); })
    .map(function (nm) { return { nome: nm.trim(), v: vals[nm], n: mt.vgv ? (vend[nm] || 0) : vals[nm] }; })
    .filter(function (x) { return x.v > 0; })
    .sort(function (x, y) { return y.v - x.v || x.nome.localeCompare(y.nome, 'pt-BR'); });
  return { lista: out, total: vals['*'] || 0, vendas: vend['*'] || 0 };
}
function dados() {
  var mt = metr(), P = periodo(), cur = ranking(mt, P.k), prev = P.comp ? ranking(mt, P.kp) : null, pp = {};
  if (prev) prev.lista.forEach(function (x, i) { pp[x.nome] = { pos: i + 1, v: x.v }; });
  var max = cur.lista.length ? cur.lista[0].v : 0;
  var itens = cur.lista.slice(0, 10).map(function (x, i) {
    var pos = i + 1, an = prev ? pp[x.nome] : null, mov = an ? an.pos - pos : null;
    return {
      pos: pos, nome: x.nome, v: x.v, n: x.n, ini: x.nome.split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join(''),
      comp: !!prev, mov: mov, novo: !!prev && !an, prevV: an ? an.v : 0, dif: prev ? x.v - (an ? an.v : 0) : 0,
      share: cur.total ? x.v / cur.total : 0, rel: max ? x.v / max : 0
    };
  });
  var novos = itens.filter(function (x) { return x.novo; });
  return { mt: mt, P: P, itens: itens, total: cur.total, totalPrev: prev ? prev.total : null, vendas: cur.vendas, novos: novos };
}
/* ---------- formatos ---------- */
function fv(mt, v) { return mt.vgv ? (v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : Math.round(v).toLocaleString('pt-BR'); }
function un(mt, v) { return mt.vgv ? 'Mi' : (v === 1 ? mt.un[0] : mt.un[1]); }
function fdif(mt, d) { var s = mt.vgv ? (Math.abs(d) / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : Math.abs(Math.round(d)).toLocaleString('pt-BR'); return (d > 0 ? '+' : d < 0 ? '−' : '') + s; }
function pct(v) { return (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
var TRI_UP = function (s, c) { return '<svg width="' + s + '" height="' + Math.round(s * .83) + '" viewBox="0 0 12 10" aria-hidden="true"><path d="M6 0L12 10H0z" fill="' + c + '"/></svg>'; };
var TRI_DN = function (s, c) { return '<svg width="' + s + '" height="' + Math.round(s * .83) + '" viewBox="0 0 12 10" aria-hidden="true"><path d="M6 10L0 0H12z" fill="' + c + '"/></svg>'; };
function cup(size, cor) { return '<svg class="cup" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v4.5a4.5 4.5 0 0 1-9 0V4z M7.5 6H5.2a2.3 2.3 0 0 0 2.6 3.6 M16.5 6h2.3a2.3 2.3 0 0 1-2.6 3.6 M12 13v4 M9 20h6 M10 17h4" fill="none" stroke="' + cor + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
var CUP_D = ['var(--gold)', 'var(--silver)', 'var(--bronze)'], CUP_L = ['var(--gold-l)', 'var(--silver-l)', 'var(--bronze-l)'];
function avatar(it, px, tone, fs, extra) {
  var f = FOTOS[it.nome] || FOTOS[it.nome.trim()];
  return '<div class="av ' + tone + '" style="width:' + px + 'px;height:' + px + 'px;font-size:' + fs + 'px;' + (extra || '') + '">' + esc(it.ini) + (f ? '<img src="' + f + '" alt="" onerror="this.remove()">' : '') + '</div>';
}
function chip(it, fs, pad) {
  if (!it.comp) return '';
  var st = 'font-size:' + fs + 'px;padding:' + pad + ';';
  if (it.novo) return '<span class="mv novo" style="font-size:' + Math.round(fs * .72) + 'px;padding:' + pad + '">NOVO</span>';
  if (it.mov > 0) return '<span class="mv up" style="' + st + '">' + TRI_UP(Math.round(fs * .7), 'var(--up)') + it.mov + '</span>';
  if (it.mov < 0) return '<span class="mv down" style="' + st + '">' + TRI_DN(Math.round(fs * .7), 'var(--down)') + (-it.mov) + '</span>';
  return '<span class="mv eq" style="' + st + '">=</span>';
}
function mono(px, inset, fs) { return '<div class="mono" aria-hidden="true" style="width:' + px + 'px;height:' + px + 'px"><i class="k"></i><i class="r"></i><i class="r"></i><i class="k"></i><b style="inset:' + inset + 'px;font-size:' + fs + 'px">P<span>R</span></b></div>'; }
function rodape() { return 'Fonte: Vista CRM · dados até ' + dd(dIdx(AG.per.ano[1])) + (QUANDO ? ' · atualizado às ' + QUANDO.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : ''); }
// Seletores reutilizáveis: cada opção recebe sua própria aparência
function selMet(fn) { return MT.map(function (m) { return fn(m, m.k === S.mt); }).join(''); }
function selPer(fn) { return PER.map(function (p) { return fn(p, p.k === S.p); }).join(''); }
function vazio(D, cor) { return '<div class="empty" style="color:' + cor + '"><h2>Ainda sem ' + (D.mt.vgv ? 'VGV' : D.mt.un[1]) + ' ' + D.P.curto + '</h2><p>O ranking aparece assim que o primeiro registro entrar no Vista. Em instantes a tela passa para a próxima métrica.</p></div>'; }

/* ---------- Opção 1 · Pódio ---------- */
function op1(D) {
  var mt = D.mt, it = D.itens, P = D.P;
  function pod(x, ord) {
    if (!x) return '<div></div>';
    var lider = ord === 0, sz = lider ? 236 : 176, alt = [210, 150, 104][ord], num = [108, 84, 64][ord];
    return '<div style="display:flex;flex-direction:column;align-items:center">' +
      (lider ? '<div style="font:600 15px/1 var(--man);letter-spacing:.22em;color:var(--red2);margin-bottom:18px">LÍDER ' + (P.k === undefined ? '' : '') + (S.p === 'ano' ? 'DO ANO' : S.p === 'mes' ? 'DO MÊS' : 'DA SEMANA') + '</div>' : '') +
      '<div style="width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;padding:' + (lider ? 6 : 5) + 'px;background:' + (lider ? 'var(--red)' : '#3a3a3d') + ';' + (lider ? 'box-shadow:0 0 0 10px rgba(176,18,28,.14)' : '') + '">' + avatar(x, sz - (lider ? 12 : 10), 'd', lider ? 70 : 52) + '</div>' +
      '<div style="margin-top:' + (lider ? 24 : 22) + 'px;display:flex;align-items:center;justify-content:center;gap:' + (lider ? 12 : 10) + 'px;font:600 ' + (lider ? 38 : 30) + 'px/1.1 var(--sora);max-width:100%">' + cup(lider ? 30 : 24, CUP_D[ord]) + '<span class="ell">' + esc(x.nome) + '</span></div>' +
      '<div style="margin-top:10px;display:flex;align-items:center;gap:' + (lider ? 14 : 12) + 'px">' + (mt.vgv ? '<span style="font:500 ' + (lider ? 30 : 24) + 'px/1 var(--sora);color:#8f8b86">R$</span>' : '') + '<span class="num" style="font:600 ' + (lider ? 76 : 56) + 'px/1 var(--sora);letter-spacing:-.03em">' + fv(mt, x.v) + '</span>' + (mt.vgv ? '<span style="font:500 ' + (lider ? 30 : 24) + 'px/1 var(--sora);color:#8f8b86">Mi</span>' : '') + chip(x, 17, '7px 12px') + '</div>' +
      '<div style="margin-top:26px;width:100%;height:' + alt + 'px;background:' + (lider ? '#1d1d1f' : '#18181a') + ';border-top:' + (lider ? '3px solid var(--red)' : '2px solid #3a3a3d') + ';display:flex;justify-content:center;padding-top:' + (lider ? 22 : ord === 1 ? 20 : 16) + 'px;font:300 ' + num + 'px/1 var(--sora);color:' + (lider ? 'var(--red)' : '#4a4a4d') + '">' + (ord + 1) + '</div></div>';
  }
  var cab = mt.vgv ? 'VGV (MI)' : mt.n.toUpperCase();

    return '<div style="display:grid;grid-template-columns:' + cols + ';gap:0 18px;align-items:center;height:92px;border-bottom:1px solid #1c1c1e">' +
      '<span class="num" style="font:500 32px/1 var(--sora);color:#8f8b86">' + x.pos + '</span><span>' + chip(x, 16, '7px 12px') + '</span>' + avatar(x, 64, 'd', 21) +
      '<span class="ell" style="font:600 27px/1.1 var(--sora)">' + esc(x.nome) + '</span><span class="num" style="text-align:right;font:600 38px/1 var(--sora);letter-spacing:-.02em">' + fv(mt, x.v) + '</span>' +
      (P.comp ? '<span class="num" style="text-align:right;font:600 18px/1 var(--man);color:' + (x.dif > 0 ? 'var(--up)' : x.dif < 0 ? 'var(--down)' : '#8f8b86') + '">' + fdif(mt, x.dif) + '</span>' : '') + '</div>';
  }).join('');
  return '<div class="st" style="background:#0b0b0c;color:#f2f0ed;padding:56px 72px 44px;display:flex;flex-direction:column;gap:36px">' +
    '<header style="display:flex;align-items:center;justify-content:space-between;gap:40px">' +
      '<div style="display:flex;align-items:center;gap:22px">' + mono(56, 14, 15) + '<div style="display:flex;flex-direction:column;gap:6px"><div style="font:600 14px/1 var(--sora);letter-spacing:.26em;color:#8f8b86">POLO RESIDENCIAL</div><h1 style="margin:0;font:600 44px/1 var(--sora);letter-spacing:-.02em">Top Corretores</h1></div></div>' +
      '<div style="display:flex;align-items:center;gap:24px">' +
        '<div class="rot" aria-label="Métricas em rotação">' + ROT.map(function (k) { var m = MT.filter(function (x) { return x.k === k; })[0]; return '<span class="' + (k === S.mt ? 'on' : '') + '">' + m.n + (k === S.mt ? '<i style="--dur:' + ROT_MS + 'ms"></i>' : '') + '</span>'; }).join('') + '</div>' +

    (it.length ? '<main style="flex:1;display:grid;grid-template-columns:1040px minmax(0,1fr);gap:72px;min-height:0">' +

        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-items:end">' + pod(it[1], 1) + pod(it[0], 0) + pod(it[2], 2) + '</div></section>' +
      '<section aria-label="Do 4º ao 10º" style="display:flex;flex-direction:column;justify-content:flex-end;min-width:0">' +
        (it.length > 3 ? '<div style="display:grid;grid-template-columns:' + cols + ';gap:0 18px;padding-bottom:14px;border-bottom:1px solid #262628;font:600 13px/1 var(--man);letter-spacing:.16em;color:#6f6b66"><span>POS.</span><span>' + (P.comp ? 'MOV.' : '') + '</span><span></span><span>CORRETOR</span><span style="text-align:right">' + cab + '</span>' + (P.comp ? '<span style="text-align:right">VS. ' + esc(P.ant.toUpperCase()) + '</span>' : '') + '</div>' + lista : '') +
      '</section></main>' : '<main style="flex:1;position:relative">' + vazio(D, '#f2f0ed') + '</main>') +
    '<footer style="display:flex;justify-content:space-between;align-items:center;font:500 16px/1 var(--man);color:#6f6b66"><span>Total da Polo ' + P.curto + ': <b style="color:#f2f0ed;font-weight:700">' + (mt.vgv ? 'R$ ' + fv(mt, D.total) + ' Mi' : fv(mt, D.total) + ' ' + un(mt, D.total)) + '</b>' + (D.totalPrev != null ? ' · período anterior: ' + (mt.vgv ? 'R$ ' + fv(mt, D.totalPrev) + ' Mi' : fv(mt, D.totalPrev)) : '') + '</span><span>' + rodape() + '</span></footer></div>';
}

var OPS = { 1: op1 };
function render() {
  if (!AG) return;
  $('#stage').innerHTML = OPS[S.o](dados());
}
function escalar() {
  var w = $('#wrap'), s = Math.min(w.clientWidth / 1920, w.clientHeight / 1080);

}
addEventListener('resize', escalar);
document.addEventListener('fullscreenchange', function () { document.body.classList.toggle('full', !!document.fullscreenElement); setTimeout(escalar, 50); });
$('#stage').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && b.dataset.retry) carregar(true); });
// Tela cheia: duplo clique ou tecla F (F11 do navegador também serve)
function telaCheia() {
  var el = document.documentElement;
  if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen().catch(function () {}); return; }
  if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
}
document.addEventListener('dblclick', telaCheia);
document.addEventListener('keydown', function (e) { if ((e.key === 'f' || e.key === 'F') && !e.target.closest('input')) telaCheia(); });
// Esconde o cursor depois de 3 s parado
var tc; document.addEventListener('mousemove', function () { document.body.classList.remove('ocioso'); clearTimeout(tc); tc = setTimeout(function () { document.body.classList.add('ocioso'); }, 3000); });
// Rotação das métricas
setInterval(function () { if (!AG) return; S.mt = ROT[(ROT.indexOf(S.mt) + 1) % ROT.length]; render(); }, ROT_MS);

/* ---------- dados ---------- */
function telaMsg(t, p, botao) {

}
function telaCarregando() {
  $('#stage').innerHTML = '<div class="st" style="background:#0b0b0c;padding:72px;display:flex;flex-direction:column;gap:24px"><div class="skel" style="width:420px;height:52px"></div><div style="flex:1;display:grid;grid-template-columns:1040px 1fr;gap:72px"><div class="skel"></div><div style="display:flex;flex-direction:column;gap:14px">' + [1, 2, 3, 4, 5, 6, 7].map(function () { return '<div class="skel" style="height:78px"></div>'; }).join('') + '</div></div></div>';
}
var MCP = null, tentou = false;
async function concluir(p) {
  var n = 0;
  while (p && p.jobComplete === false && n < 8) {
    var id = (p.jobReference && p.jobReference.jobId) || p.jobId || p.job_id; if (!id) break;
    var r = await MCP.callTool(SRV, 'get_query_results', { projectId: 'vistaprocessos', jobId: id, location: (p.jobReference && p.jobReference.location) || 'us-east1', timeoutMs: 30000 }, { cache: false });
    p = r.payload; n++;

  if (!p || !p.rows) throw { code: 'sem_linhas' };

}
function lerAgregado(rows) {
  var A = { per: {}, d: {} };
  rows.forEach(function (r) {
    var k = r[0], m = r[1], s = r[2] || '';
    if (m === '_per') { A.per[k] = s.split('|'); return; }
    if (k === '_foto') { if (s) FOTOS[m.trim()] = s; return; }
    if (k === 'zz') return;
    var o = (A.d[k] = A.d[k] || {})[m] = {};
    s.split(';').forEach(function (t) { var i = t.lastIndexOf('|'); if (i > 0) o[t.slice(0, i)] = +t.slice(i + 1); });
  });
  if (!A.per.ano) throw { code: 'sem_linhas' };

}
async function carregar(forcar) {
  // Versão estática (GitHub Pages): a página injeta window.__poloFonte, que devolve as linhas já decifradas
  if (window.__poloFonte) {
    try {
      var res = await window.__poloFonte(forcar);
      if (!res) return;
      AG = lerAgregado(res.rows); QUANDO = res.gerado ? new Date(res.gerado) : null; render();
    } catch (e) { if (!AG) telaMsg('Não foi possível carregar', 'O arquivo de dados não respondeu. Tente de novo em instantes.', 'Tentar de novo'); }
    return;
  }
  if (!AG) telaCarregando();
  if (!MCP) MCP = await claude.use('mcp');
  if (!MCP) { telaMsg('Abra no claude.ai', 'O ranking lê os dados do Vista pelo BigQuery e só carrega quando aberto no claude.ai, com o conector conectado.'); return; }
  try {
    var limite = new Promise(function (_, rej) { setTimeout(function () { rej({ code: 'timeout' }); }, 150000); });
    var r = await Promise.race([MCP.callTool(SRV, 'execute_sql_readonly', { projectId: 'vistaprocessos', query: SQL, timeoutMs: 60000 }, { cache: forcar ? { refresh: true, gcTime: 86400000 } : { staleTime: 300000, gcTime: 86400000 } }), limite]);
    var p = await Promise.race([concluir(r.payload), limite]);
    AG = lerAgregado(p.rows.map(function (x) { return x.f.map(function (c) { return c.v; }); }));
    QUANDO = r.cache && r.cache.storedAt ? new Date(r.cache.storedAt) : new Date();
    tentou = false; render();
  } catch (e) {
    if (e && e.retryable && !tentou) { tentou = true; setTimeout(function () { carregar(forcar); }, (e.retryAfterMs || 1500) + Math.random() * 800); return; }
    if (AG) return; // mantém a última leitura na tela
    var c = e && e.code;
    if (c === 'server_not_connected' || c === 'selection_required') telaMsg('Conecte o BigQuery', 'Adicione o conector “Google Cloud BigQuery” em claude.ai → Configurações → Conectores e abra o ranking de novo.');
    else if (c === 'needs_reauth') telaMsg('Reconecte o BigQuery', 'O acesso ao conector “Google Cloud BigQuery” expirou. Reconecte em claude.ai → Configurações → Conectores.');
    else if (c === 'approval_required' || c === 'not_in_manifest') telaMsg('Permita o acesso aos dados', 'O ranking precisa da sua autorização para consultar o BigQuery.', 'Permitir e carregar');
    else if (c === 'blocked_by_policy') telaMsg('Acesso bloqueado', 'A política da sua organização não permite este conector para a sua conta.');
    else telaMsg('Não foi possível carregar', 'O BigQuery não respondeu a tempo. Tente de novo em instantes.', 'Tentar de novo');
  }
}
// TV ligada por horas: busca dados novos a cada 30 minutos e redesenha
setInterval(function () { carregar(true); }, 30 * 60 * 1000);
escalar(); render(); carregar(false);
