<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<title>Dashboard Polo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- v2026-10-24c senha: sem compressão, aviso de navegador, ?sair -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: barra lateral em tinta preta (o quadrante do logo) + área de leitura clara; o funil é a peça central. */
:root{
  --paper:#f3f3f1; --surface:#ffffff; --ink:#151515; --ink2:#5e5b57; --ink3:#8d8984; --line:#e3e1dd; --track:#eeece9;
  --red:#ad111b; --red2:#c8323a; --redsoft:#f6e3e3; --bar:#2a2a2a; --barsoft:#c9c6c1;
  --side:#121212; --side2:#1c1c1d; --sidefg:#ecebe8; --sidemut:#8f8b86;
  --up:#2b7a4b; --down:#b4601a; --upbg:#e3f1e8; --downbg:#f8ebdf;
  --display:Sora,system-ui,sans-serif;
  --body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e0e0f; --surface:#171718; --ink:#efedea; --ink2:#a6a29c; --ink3:#77736e; --line:#29292b; --track:#212123;
  --red:#e2353e; --red2:#f05a61; --redsoft:#3a1416; --bar:#d9d6d1; --barsoft:#4a4846;
  --side:#08080a; --side2:#141416; --sidefg:#ecebe8; --sidemut:#85817c;
  --up:#4cc27f; --down:#e8964d; --upbg:#15291e; --downbg:#2e1f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e0e0f; --surface:#171718; --ink:#efedea; --ink2:#a6a29c; --ink3:#77736e; --line:#29292b; --track:#212123;
  --red:#e2353e; --red2:#f05a61; --redsoft:#3a1416; --bar:#d9d6d1; --barsoft:#4a4846;
  --side:#08080a; --side2:#141416; --sidefg:#ecebe8; --sidemut:#85817c;
  --up:#4cc27f; --down:#e8964d; --upbg:#15291e; --downbg:#2e1f12; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}

/* ---------- barra lateral ---------- */
.side{background:var(--side);color:var(--sidefg);display:flex;flex-direction:column;gap:28px;padding:26px 18px 20px max(18px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;gap:12px;align-items:center}
.mono{width:44px;height:44px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:2px;position:relative}
.mono i{display:block}
.mono i:nth-child(1),.mono i:nth-child(4){background:#000;box-shadow:inset 0 0 0 1px #2e2e2e}
.mono i:nth-child(2),.mono i:nth-child(3){background:#b0121c}
.mono b{position:absolute;inset:11px;background:#fff;color:#1a1a1a;font:600 13px/1 var(--display);display:flex;align-items:center;justify-content:center;letter-spacing:-.5px}
.mono b span{color:#b0121c}
.wm{line-height:1.05}
.wm strong{display:block;font:600 14px/1.15 var(--display);letter-spacing:.14em}
.wm small{display:block;margin-top:5px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sidemut)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--sidemut);font-weight:500;font-size:14px;transition:background .15s,color .15s}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{color:var(--sidefg);background:var(--side2)}
.nav button[aria-current="page"]{color:#fff;background:var(--side2)}
.nav button[aria-current="page"] svg{stroke:#e2353e}
.nav button:focus-visible{outline:2px solid #e2353e}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--sidemut)}
.sidefoot .row{display:flex;gap:8px}
.sbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #2c2c2e;border-radius:7px;color:var(--sidefg);font-size:12px}
.sbtn:hover{border-color:#4a4a4c}
.sbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.sbtn:focus-visible{outline:2px solid #e2353e}

/* ---------- área principal ---------- */
.main{min-width:0;padding-block:28px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1440px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font:600 clamp(26px,3.4vw,34px)/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.ctl{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0}
select.ctl{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.range{display:flex;align-items:center;gap:6px}
.range .ctl{width:138px}
.preset{display:flex;gap:4px;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;white-space:nowrap}
.pill:hover{color:var(--ink);border-color:var(--ink3)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.grid{display:grid;gap:18px}
.g-ov{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.ct{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.ct h2{margin:0;font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase}
.ct .sub{color:var(--ink3);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- funil ---------- */
.fun{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:132px 64px minmax(0,1fr) 92px;align-items:center;gap:14px;height:38px}
.flab{text-align:right;color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fval{font:600 21px/1 var(--display);letter-spacing:-.01em;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.ftrack{height:22px;background:var(--track);border-radius:4px;display:flex;justify-content:center;overflow:hidden}
.fbar{height:100%;background:var(--bar);border-radius:3px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.fconv{display:grid;grid-template-columns:132px 64px minmax(0,1fr) 92px;gap:14px;height:18px;align-items:center}
.fconv span{grid-column:3;justify-self:center;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.fconv span svg{width:9px;height:9px;stroke:var(--ink3);fill:none;stroke-width:1.6}
.frow.sale .flab{color:var(--red);font-weight:600}
.frow.sale .fval{color:var(--red)}
.frow.sale .fbar{background:var(--red)}
.fvgv{grid-column:3;justify-self:center;margin-top:6px;font-size:12px;color:var(--ink2)}
.fvgv b{font:600 14px var(--display);color:var(--ink)}
.chg{justify-self:start;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chg.up{color:var(--up);background:var(--upbg)}
.chg.down{color:var(--down);background:var(--downbg)}
.chg.flat,.chg.nb{color:var(--ink3);background:var(--track)}

/* ---------- resumo ---------- */
.res{display:flex;flex-direction:column}
.hero{padding-bottom:16px;border-bottom:1px solid var(--line)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.big{font:600 38px/1.1 var(--display);letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:lining-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv .v{font:600 19px var(--display);font-variant-numeric:lining-nums tabular-nums;text-align:right}
.kv .k{color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);margin:10px 0 0}

/* ---------- gráficos ---------- */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink3);font-family:var(--body);font-size:11px}
.chart .vl{fill:var(--ink2);font-size:11px;font-weight:600}
.chart .grid line{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* ---------- ranking ---------- */
.rank{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow:auto;padding-right:4px}
.rk{display:grid;grid-template-columns:22px minmax(0,130px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.rk .p{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
.rk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .tr{height:14px;background:var(--track);border-radius:3px;overflow:hidden}
.rk .tr i{display:block;height:100%;background:var(--bar);border-radius:3px}
.rk:first-child .tr i{background:var(--red)}
.rk .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- tabelas ---------- */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td:first-child{max-width:260px;overflow:hidden;text-overflow:ellipsis}
thead th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
thead th:hover{color:var(--ink)}
thead th[aria-sort]::after{content:" ↓";color:var(--red)}
thead th[aria-sort="ascending"]::after{content:" ↑"}
tbody tr:hover td{background:var(--track)}
tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink3)}
td.cv{color:var(--ink3);font-size:12px}
th.cv{color:var(--ink3);opacity:.8}
td .bm{display:inline-block;height:6px;background:var(--barsoft);border-radius:2px;margin-right:8px;vertical-align:middle}
.empty{color:var(--ink3);padding:20px 0;text-align:center}

/* ---------- participação ---------- */
.band{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:16px}
.band i{display:block;height:100%;min-width:3px}
.share{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 28px}
.sh{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:9px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.sh i{width:10px;height:10px;border-radius:2px}
.sh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .n{font-weight:600;font-variant-numeric:tabular-nums}
.sh .pc{color:var(--ink3);font-size:12px;width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- comparativo ---------- */
.cmp-head{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:18px;margin-bottom:22px}
.cmp-p{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px;border:1px solid var(--line);border-radius:8px}
.cmp-p .fld{flex:1 1 130px;min-width:0}
.cmp-p .ctl{width:100%}
.cmp-p .tag{width:100%;font:600 16px var(--display)}
.cmp-p .tag em{font-style:normal;color:var(--ink3);font-family:var(--body);font-size:12px;margin-left:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:18px;align-items:center;min-height:44px}
.cside{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.cside.r{grid-template-columns:minmax(0,1fr) 52px}
.cside .fval{font-size:20px}
.cside.l .fval{text-align:right}
.cside.r .fval{text-align:left}
.cside .ftrack{justify-content:flex-end}
.cside.r .ftrack{justify-content:flex-start}
.cmid{text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center}
.cmid .nm{font-weight:600;font-size:13px}
.cmid.sale .nm{color:var(--red)}
.ccv{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:18px;font-size:11px;color:var(--ink3);height:14px}
.ccv span:first-child{text-align:right;padding-right:64px}
.ccv span:last-child{padding-left:64px}
.cvgv{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:18px;margin-top:8px;font-size:12px;color:var(--ink2)}
.cvgv span:first-child{text-align:right;padding-right:64px}
.cvgv span:last-child{padding-left:64px}
.cvgv b{font:600 14px var(--display);color:var(--ink)}

/* ---------- financeiro ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.kpi .big{font-size:34px}
.deal td:nth-child(2){color:var(--ink2)}

/* ---------- estados ---------- */
.state{display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:560px;padding:40px 0}
.state h2{margin:0;font:600 24px var(--display);letter-spacing:-.01em}
.state p{margin:0;color:var(--ink2)}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:600;font-size:13px}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--track),var(--line),var(--track));background-size:200% 100%;animation:sk 1.4s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.loading{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.banner{font-size:12.5px;color:var(--ink2);background:var(--track);border-radius:8px;padding:9px 12px}
.stamp{font-size:11.5px;color:var(--sidemut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- responsivo ---------- */
@media (max-width:1180px){.g-ov{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .mono{width:34px;height:34px}.mono b{inset:8px;font-size:12px}
  .wm strong{font-size:12.5px}.wm small{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3;gap:4px;scrollbar-width:none}
  .nav button{padding:7px 10px;font-size:13px;white-space:nowrap}
  .nav button svg{display:none}
  .sidefoot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .sidefoot .stamp{display:none}
  .main{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g-2,.kpis{grid-template-columns:minmax(0,1fr)}
  .head h1{font-size:28px}
}
@media (max-width:620px){
  .frow,.fconv{grid-template-columns:96px 46px minmax(0,1fr) 62px;gap:8px}
  .fval{font-size:17px}
  .chg{font-size:10.5px;padding:2px 5px}
  .card{padding:16px}
  .range .ctl{width:128px}
  .cmp-head{grid-template-columns:minmax(0,1fr);gap:10px}.cmp-head>div:nth-child(2){display:none}
  .crow,.ccv,.cvgv{grid-template-columns:minmax(0,1fr) 74px minmax(0,1fr);gap:8px}
  .cside{grid-template-columns:40px minmax(0,1fr);gap:6px}.cside.r{grid-template-columns:minmax(0,1fr) 40px}
  .cside .fval{font-size:16px}
  .ccv span:first-child,.cvgv span:first-child{padding-right:46px}.ccv span:last-child,.cvgv span:last-child{padding-left:46px}
  .big{font-size:32px}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mono" aria-hidden="true"><i></i><i></i><i></i><i></i><b>P<span>R</span></b></div>
      <div class="wm"><strong>POLO<br>RESIDENCIAL</strong><small>Business Intelligence</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Páginas">
      <button data-p="ov" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg>Visão Geral</button>
      <button data-p="pf"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg>Performance</button>
      <button data-p="ex"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg>Exploração</button>
      <button data-p="cp"><svg viewBox="0 0 24 24"><path d="M4 6h7M4 12h7M4 18h7M13 6h7M13 12h7M13 18h7"/></svg>Comparativo</button>
      <button data-p="fi"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.6"/></svg>Financeiro</button>
    </nav>
    <div class="sidefoot">
      <span class="stamp" id="stamp">Carregando dados…</span>
      <div class="row">
        <button class="sbtn" id="refresh" title="Buscar os dados mais recentes"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Atualizar</button>
        <button class="sbtn" id="theme" title="Alternar tema claro ou escuro"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Tema</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div><h1 id="pt">Visão Geral</h1><p id="ps">Resumo consolidado da performance comercial.</p></div>
      <div class="filters" id="filters">
        <label class="fld" id="f-per"><span>Período</span>
          <div class="range"><input class="ctl" type="date" id="d1" aria-label="Data inicial"><input class="ctl" type="date" id="d2" aria-label="Data final"></div>
        </label>
        <label class="fld" id="f-mes" hidden><span>Mês</span><select class="ctl" id="mes"></select></label>
        <label class="fld"><span>Corretor</span><select class="ctl" id="fcor"><option value="0">Todos</option></select></label>
        <label class="fld"><span>Veículo de captação</span><select class="ctl" id="fvei"><option value="">Todos</option></select></label>
      </div>
    </header>
    <div class="preset" id="presets">
      <button class="pill" data-pr="mes">Mês atual</button>
      <button class="pill" data-pr="ant">Mês anterior</button>

      var portao = document.getElementById('portao'); if (portao) { portao.remove(); document.documentElement.style.overflow = ''; }
      $('#filters').style.visibility = $('#presets').style.visibility = '';
      aplicar({ rows: res.rows.map(function (r) { return { f: r.map(function (v) { return { v: v }; }) }; }) }, null);
      if (res.gerado) $('#stamp').textContent = 'Dados até ' + fmt.data(hojeIdx() - 1) + ' · gerados em ' + new Date(res.gerado).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      if (C) { $('#stamp').textContent = 'Falha ao atualizar; mostrando a última leitura.'; return; }
      estado('Não foi possível carregar', 'O arquivo de dados não respondeu. Confira a conexão e tente de novo.', 'Tentar de novo', function () { carregar(true); });
    }
    return;
  }
  if (!C) carregando();
  if (!MCP) MCP = await claude.use('mcp');
  if (!MCP) { estado('Abra no claude.ai', 'Este painel consulta o BigQuery com o conector do claude.ai e só carrega dados quando aberto lá, com sua conta conectada.'); return; }
  try {
    var r = await MCP.callTool(SRV, 'execute_sql_readonly', { projectId: 'vistaprocessos', query: SQL, timeoutMs: 90000 }, { cache: forcar ? { refresh: true, gcTime: 86400000 } : { staleTime: 300000, gcTime: 86400000 } });
    var p = await concluir(r.payload);
    aplicar(p, r.cache && r.cache.storedAt);
  } catch (e) {
    if (e && e.retryable && !carregar.tentou) { carregar.tentou = true; setTimeout(function () { carregar(forcar); }, (e.retryAfterMs || 1500) + Math.random() * 800); return; }
    if (C) { $('#stamp').textContent = 'Falha ao atualizar; mostrando a última leitura.'; return; }
    erro(e);
  }
}
$('#refresh').onclick = function () { carregar.tentou = false; $('#stamp').textContent = 'Atualizando…'; carregar(true); };
carregar(false);
</script>
