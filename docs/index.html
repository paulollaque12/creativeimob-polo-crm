<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
</head>
<body>
<title>Dashboard Polo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- v2026-11-04q barra lateral fixa, sem Atualizar, tema discreto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: barra lateral em tinta preta (o quadrante do logo) + área de leitura clara; o funil é a peça central. */
:root{
  --paper:#f3f3f1; --surface:#ffffff; --ink:#151515; --ink2:#5e5b57; --ink3:#8d8984; --line:#e3e1dd; --track:#eeece9;
  --red:#ad111b; --red2:#c8323a; --redsoft:#f6e3e3; --bar:#b0121c; --bar2:#7a0c13; --barsoft:#e8c3c5; --hv:rgba(21,21,21,.05);
  --side:#121212; --side2:#1c1c1d; --sidefg:#ecebe8; --sidemut:#8f8b86;
  --up:#2b7a4b; --down:#b4601a; --upbg:#e3f1e8; --downbg:#f8ebdf;
  --display:Sora,system-ui,sans-serif;
  --body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e0e0f; --surface:#171718; --ink:#efedea; --ink2:#a6a29c; --ink3:#77736e; --line:#29292b; --track:#212123;
  --red:#e2353e; --red2:#f05a61; --redsoft:#3a1416; --bar:#cf2530; --bar2:#7d1219; --barsoft:#5c1d21; --hv:rgba(255,255,255,.045);
  --side:#08080a; --side2:#141416; --sidefg:#ecebe8; --sidemut:#85817c;
  --up:#4cc27f; --down:#e8964d; --upbg:#15291e; --downbg:#2e1f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e0e0f; --surface:#171718; --ink:#efedea; --ink2:#a6a29c; --ink3:#77736e; --line:#29292b; --track:#212123;
  --red:#e2353e; --red2:#f05a61; --redsoft:#3a1416; --bar:#cf2530; --bar2:#7d1219; --barsoft:#5c1d21; --hv:rgba(255,255,255,.045);
  --side:#08080a; --side2:#141416; --sidefg:#ecebe8; --sidemut:#85817c;
  --up:#4cc27f; --down:#e8964d; --upbg:#15291e; --downbg:#2e1f12; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}

/* ---------- barra lateral ---------- */
.side{background:var(--side);color:var(--sidefg);display:flex;flex-direction:column;gap:28px;padding:26px 18px 20px max(18px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;gap:12px;align-items:center}
.mono{width:44px;height:44px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:2px;position:relative}
.mono i{display:block}
.mono i:nth-child(1),.mono i:nth-child(4){background:#000;box-shadow:inset 0 0 0 1px #2e2e2e}
.mono i:nth-child(2),.mono i:nth-child(3){background:#b0121c}
.mono b{position:absolute;inset:11px;background:#fff;color:#1a1a1a;font:600 13px/1 var(--display);display:flex;align-items:center;justify-content:center;letter-spacing:-.5px}
.mono b span{color:#b0121c}
.wm{line-height:1.05}
.wm strong{display:block;font:600 14px/1.15 var(--display);letter-spacing:.14em}
.wm small{display:block;margin-top:5px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sidemut)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--sidemut);font-weight:500;font-size:14px;transition:background .15s,color .15s}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{color:var(--sidefg);background:var(--side2)}
.nav button[aria-current="page"]{color:#fff;background:var(--side2)}
.nav button[aria-current="page"] svg{stroke:#e2353e}
.nav button:focus-visible{outline:2px solid #e2353e}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--sidemut)}
.sidefoot .row{display:flex;gap:8px}
.sbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #2c2c2e;border-radius:7px;color:var(--sidefg);font-size:12px}
.sbtn:hover{border-color:#4a4a4c}
.sbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.sbtn:focus-visible{outline:2px solid #e2353e}
.sbtn.tema{width:28px;height:28px;padding:0;justify-content:center;border-radius:50%;border-color:transparent;color:var(--sidemut);opacity:.7;transition:opacity .15s,color .15s,border-color .15s}
.sbtn.tema:hover{opacity:1;color:var(--sidefg);border-color:#2c2c2e}
.sbtn.tema svg{width:14px;height:14px}

/* ---------- área principal ---------- */
.main{min-width:0;padding-block:28px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1440px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font:600 clamp(26px,3.4vw,34px)/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.ctl{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0}
select.ctl{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.range{display:flex;align-items:center;gap:6px}
.range .ctl{width:138px}
.preset{display:flex;gap:4px;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;white-space:nowrap}
.pill:hover{color:var(--ink);border-color:var(--ink3)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.grid{display:grid;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
#view>.note{margin:-6px 0 0}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{all:unset;cursor:pointer;height:24px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.g-ov{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.ct{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.ct h2{margin:0;font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase}
.ct .sub{color:var(--ink3);font-size:12.5px}
/* ícone "i" com explicação no hover/foco (padrão do dashboard da Gralha) */
.ct h2{position:relative;display:inline-flex;align-items:center;gap:8px}
.inf{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--ink3);color:var(--ink3);font:600 10px/1 var(--display);font-style:normal;letter-spacing:0;text-transform:none;cursor:help;transition:color .15s,border-color .15s}
.inf:hover,.inf:focus-visible{color:var(--ink);border-color:var(--ink);outline:none}
.inft{position:absolute;left:0;top:calc(100% + 10px);z-index:30;width:min(400px,80vw);padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35);font:400 12.5px/1.55 var(--body);letter-spacing:0;text-transform:none;color:var(--ink2);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s;pointer-events:none}
.inf:hover~.inft,.inf:focus~.inft{opacity:1;visibility:visible;transform:none}
.inft b{color:var(--ink);font-weight:600}
.inft ul{margin:8px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.inft li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px}
.inft p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- funil ---------- */
.fun{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:132px 64px minmax(0,1fr) 92px;align-items:center;gap:14px;height:38px}
.flab{text-align:right;color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fval{font:600 21px/1 var(--display);letter-spacing:-.01em;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.ftrack{height:22px;background:var(--track);border-radius:4px;display:flex;justify-content:center;overflow:hidden}
.fbar{height:100%;background:var(--bar);border-radius:3px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.fconv{display:grid;grid-template-columns:132px 64px minmax(0,1fr) 92px;gap:14px;height:18px;align-items:center}
.fconv span{grid-column:3;justify-self:center;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.fconv span svg{width:9px;height:9px;stroke:var(--ink3);fill:none;stroke-width:1.6}
.frow.sale .flab{color:var(--red);font-weight:600}
.frow.sale .fval{color:var(--red)}
.frow.sale .fbar{background:var(--red)}
.fvgv{grid-column:3;justify-self:center;margin-top:6px;font-size:12px;color:var(--ink2)}
.fvgv b{font:600 14px var(--display);color:var(--ink)}
.chg{justify-self:start;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chg.up{color:var(--up);background:var(--upbg)}
.chg.down{color:var(--down);background:var(--downbg)}
.chg.flat,.chg.nb{color:var(--ink3);background:var(--track)}

/* ---------- resumo ---------- */
.res{display:flex;flex-direction:column}
.kvs{flex:1;display:flex;flex-direction:column}
.kvs .kv{flex:1;align-items:center;min-height:46px}
.kvs .kv:last-child{border-bottom:1px solid var(--line);padding-bottom:12px}
.res .note{margin-top:14px}
.hero{padding-bottom:16px;border-bottom:1px solid var(--line)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.big{font:600 38px/1.1 var(--display);letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:lining-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv .v{font:600 19px var(--display);font-variant-numeric:lining-nums tabular-nums;text-align:right}
.kv .k{color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);margin:10px 0 0}

/* ---------- gráficos ---------- */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink3);font-family:var(--body);font-size:11px}
.chart .vl{fill:var(--ink2);font-size:11px;font-weight:600}
.chart .grid line{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.chart .grid line{stroke-dasharray:3 4}
.chart .hb{fill:var(--hv);opacity:0;transition:opacity .1s}.chart .hg{stroke:var(--ink3);stroke-width:1.2;stroke-dasharray:4 4;opacity:0;transition:opacity .1s}
.chart svg.hov .hb,.chart svg.hov .hg{opacity:1}
.chart .br{transition:filter .12s}.chart .br.on{filter:brightness(1.18)}
.chart .pt{fill:var(--surface);stroke:var(--bar);stroke-width:2;transition:r .12s}.chart .pt.on{r:5.5}
.chart .pt.so{opacity:0;transition:opacity .1s}.chart .pt.so.on{opacity:1}
.chart .ax.on{fill:var(--ink);font-weight:600}
.ctip{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-100%);padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.3);opacity:0;transition:opacity .1s}
.ctip.on{opacity:1}.ctip{transform:translate(0,-100%)}
.ctip small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}.ctip b{font:600 16px var(--display)}.ctip span{opacity:.75}
/* Evolução: gráfico à esquerda, métricas em lista à direita (modelo Gralha) */
.evo{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:8px 28px;align-items:start}
.evo .cap{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink2)}
.desc{margin:0 0 16px;font-size:12.5px;color:var(--ink3);line-height:1.5}
.ct + .desc{margin-top:-8px}
/* Performance: trilho de métricas (funil numerado + imóveis) */
.mrail{display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) 18px repeat(2,minmax(0,1.3fr));gap:6px;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mrail::-webkit-scrollbar{display:none}
.mrail .gl{grid-row:1;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:0 2px 6px;display:flex;align-items:center;gap:8px}
.mrail .gl::after{content:"";flex:1;height:1px;background:var(--line)}
.mt{all:unset;box-sizing:border-box;cursor:pointer;grid-row:2;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;padding:11px 10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s,transform .15s}
.mt:hover{border-color:var(--ink3);transform:translateY(-1px)}
.mt .st{font:600 10px/1 var(--display);letter-spacing:.08em;color:var(--ink3)}
.mt .nm{font-size:11.5px;letter-spacing:-.02em;font-weight:600;color:var(--ink2);line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:normal;overflow-wrap:normal}
.mt .vl{font:600 22px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.mt::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--red);transform:scaleX(0);transition:transform .2s}
.mt[aria-pressed="true"]{border-color:var(--red);background:linear-gradient(180deg,rgba(176,18,28,.14),rgba(176,18,28,.03))}
.mt[aria-pressed="true"]::after{transform:scaleX(1)}
.mt[aria-pressed="true"] .st{color:var(--red)}.mt[aria-pressed="true"] .nm{color:var(--ink)}
.mt:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mt .ar{position:absolute;right:-6px;top:50%;width:6px;height:1px;background:var(--line)}
/* Performance: evolução semanal com mês anterior e semanas ainda por vir */
.pfc{display:flex;flex-direction:column}
.pfc .chart{flex:1;min-height:240px}
.lgd{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--ink3);margin:0 0 6px}
.lgd i{display:inline-block;width:18px;height:0;border-top:2.4px solid var(--bar);vertical-align:middle;margin-right:6px}
.lgd i.ant{border-top:1.6px dashed var(--ink3)}
.chart .fut{fill:var(--hv)}
.chart .futl{fill:var(--ink3);font-size:10.5px;letter-spacing:.1em}
.chart .div{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 4}
.chart .ant{fill:none;stroke:var(--ink3);stroke-width:1.6;stroke-dasharray:5 4;opacity:.8}
.chart .pa{fill:var(--surface);stroke:var(--ink3);stroke-width:1.5}
.chart .pt.parc{fill:var(--bar)}
.chart .ax.fu{opacity:.5}
.ctip .ln2{display:block;margin-top:4px;font-size:11.5px;opacity:.82}
.ctip .up{color:#4cc27f}.ctip .dn{color:#e8964d}
@media (max-width:1320px){.mrail{grid-template-columns:repeat(8,minmax(98px,1fr)) 12px repeat(2,minmax(124px,1fr))}}
/* Suavizar (só no gráfico de linha por dia): botão discreto dentro do gráfico */
.suav{position:absolute;top:0;right:0;z-index:4;display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.suav button{all:unset;cursor:pointer;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink3);display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s}
.suav button:hover{color:var(--ink)}
.suav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.suav button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.suav svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.chart .bruta{fill:none;stroke:var(--bar);stroke-width:1.3;opacity:.35;stroke-dasharray:2 3}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist .lb{font-size:11.5px;color:var(--ink3);margin:0 0 2px}
.mlist button{all:unset;cursor:pointer;height:34px;border-radius:8px;border:1px solid var(--line);text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);transition:background .12s,color .12s,border-color .12s}
.mlist button:hover{color:var(--ink);border-color:var(--ink3)}
.mlist button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.mlist button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ctl2{display:flex;align-items:center;gap:10px}
.seg.ic button{padding:0 9px}.seg.ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;display:block}
@media (max-width:900px){.evo{grid-template-columns:minmax(0,1fr)}.mlist{flex-direction:row;flex-wrap:wrap;order:-1}.mlist .lb{display:none}.mlist button{padding:0 12px}}
.tip.on{opacity:1}

/* ---------- ranking ---------- */
.rank{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow-y:auto;overflow-x:hidden;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tw.alta{max-height:430px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tw.alta::-webkit-scrollbar{width:6px;height:6px}.tw.alta::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}.tw.alta::-webkit-scrollbar-track{background:transparent}
.tw.alta tfoot td{position:sticky;bottom:0;background:var(--surface);z-index:1;border-top:0;box-shadow:inset 0 1px 0 var(--ink3)}
.tw.alta thead th{z-index:2;box-shadow:inset 0 -1px 0 var(--line)}
.tw.alta tfoot td:first-child{z-index:2}
#tpf th:not(:first-child),#tpf td:not(:first-child){text-align:center}
#tpf .fu{opacity:.4}
/* Exploração · tabela "Funil por": métricas e conversões com larguras fixas e centralizadas */
#tex{width:max-content;min-width:100%}
#tex th,#tex td{text-align:center}
#tex th:first-child,#tex td:first-child{text-align:left;min-width:200px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
#tex .mc{width:96px;min-width:96px}
#tex .cv{width:58px;min-width:58px}
#tex .vg{width:116px;min-width:116px}
#tex thead th{white-space:normal;line-height:1.3;vertical-align:bottom}

      'font:600 20px var(--body);text-align:center;letter-spacing:.08em;outline:none;transition:border-color .15s}' +

    '#portao button:hover{background:#c8323a}#portao button:focus-visible{outline:2px solid #fff;outline-offset:3px}' +

/* Polo · versão estática (GitHub Pages)
   Lê o arquivo cifrado (AES-GCM, chave PBKDF2-SHA256; opcionalmente comprimido com zlib),
   pede a senha uma vez e a guarda neste aparelho (a mesma para o ranking e o painel).
   Configuração opcional em window.__poloCfg = { alvo: seletor, tela: function (erro) { return html } }:
   a tela precisa ter um <form id="fsenha"> com um <input id="isenha">. Sem configuração, usa a tela do ranking da TV. */
(function () {
  var CHAVE = 'polo-tv-senha';
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function decifrar(pkg, senha) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(pkg.salt), iterations: pkg.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    if (pkg.z && typeof DecompressionStream === 'undefined') throw new Error('sem DecompressionStream');
    var claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(pkg.iv) }, key, b64(pkg.ct));
    var texto = pkg.z
      ? await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('deflate'))).text()
      : new TextDecoder().decode(claro);
    return JSON.parse(texto);
  }
  // Painel (lembrar:false): senha só nesta aba, pedida a cada abertura. TV: fica salva no aparelho.
  function loja() { var c = window.__poloCfg || {}; return c.lembrar === false ? sessionStorage : localStorage; }
  if ((window.__poloCfg || {}).lembrar === false) { try { localStorage.removeItem(CHAVE); } catch (e) {} }
  function lerSenha() { try { return loja().getItem(CHAVE); } catch (e) { return null; } }
  function guardar(s) { try { loja().setItem(CHAVE, s); } catch (e) {} }
  function esquecer() { try { loja().removeItem(CHAVE); } catch (e) {} }
  function telaTV(erro) {
    return '<div class="st" style="background:#0b0b0c;color:#f2f0ed;display:flex;align-items:center;justify-content:center">' +
      '<form id="fsenha" style="width:640px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center">' +
        '<div class="mono" aria-hidden="true" style="width:72px;height:72px"><i class="k"></i><i class="r"></i><i class="r"></i><i class="k"></i><b style="inset:18px;font-size:19px">P<span>R</span></b></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><h1 style="margin:0;font:600 48px/1.1 var(--sora);letter-spacing:-.02em">Top Corretores</h1>' +
        '<p style="margin:0;font:500 21px/1.4 var(--man);color:#8f8b86">Digite a senha da Polo para abrir o ranking. Ela fica salva nesta tela.</p></div>' +
        '<label for="isenha" style="position:absolute;left:-9999px">Senha</label>' +
        '<input id="isenha" type="password" autocomplete="current-password" style="width:100%;height:72px;padding:0 24px;border-radius:14px;border:1px solid #2c2c2f;background:#151517;color:#f2f0ed;font:600 26px var(--man);text-align:center;letter-spacing:.08em">' +
        (erro ? '<p role="alert" style="margin:-8px 0 0;font:600 19px var(--man);color:#ff6b57">Senha incorreta. Tente de novo.</p>' : '') +
        '<button type="submit" style="all:unset;cursor:pointer;width:100%;height:72px;border-radius:14px;background:#b0121c;color:#fff;font:700 24px/72px var(--man);text-align:center">Entrar</button>' +
      '</form></div>';
  }
  function pedirSenha(pkg, erro) {
    var cfg = window.__poloCfg || {};
    return new Promise(function (ok) {
      var alvo = document.querySelector(cfg.alvo || '#stage');
      alvo.innerHTML = (cfg.tela || telaTV)(erro);
      if (erro === 'nav') alvo.querySelector('#fsenha').insertAdjacentHTML('beforeend', '<p class="er" role="alert" style="color:#ff6b57">Este navegador não conseguiu abrir os dados. Atualize o navegador ou use Chrome, Edge ou Safari recente.</p>');
      var inp = document.getElementById('isenha'); setTimeout(function () { inp.focus(); }, 50);
      document.getElementById('fsenha').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var s = inp.value; if (!s) return;
        decifrar(pkg, s).then(function (d) { guardar(s); ok(d); }).catch(function (e) {
          // OperationError = senha errada; qualquer outro erro é limitação do navegador
          pedirSenha(pkg, e && e.name === 'OperationError' ? true : 'nav').then(ok);
        });
      });
    });
  }
  window.__poloFonte = async function () {
    var r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    var pkg = await r.json();
    if (/[?&#]sair\b/.test(location.href)) esquecer();   // ?sair apaga a senha salva neste navegador
    var s = lerSenha();
    if (s) { try { return await decifrar(pkg, s); } catch (e) { esquecer(); } }
    return pedirSenha(pkg, false);
  };
})();

<script>
// ===== Motor de cálculo do Dashboard Polo (puro, sem DOM) =====
var E0 = Date.UTC(2025, 0, 1);            // dia 0 do cubo
var DAY = 86400000;
var MET = [
  { k: 'leads', n: 'Leads', s: 'Leads captados' },
  { k: 'c1', n: '1º Contato' },
  { k: 'pre', n: 'Pré-atendimento' },
  { k: 'atd', n: 'Atendimento' },
  { k: 'agd', n: 'Agendamento' },
  { k: 'vis', n: 'Visita' },
  { k: 'prop', n: 'Proposta' },
  { k: 'vend', n: 'Venda' },
  { k: 'agc', n: 'Agenciamentos' },
  { k: 'pla', n: 'Placas' }
];
var FUNIL = [0, 1, 2, 3, 4, 5, 6, 7];

function dIdx(iso) { var p = iso.split('-'); return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - E0) / DAY); }
function dIso(i) { return new Date(E0 + i * DAY).toISOString().slice(0, 10); }
function dObj(i) { return new Date(E0 + i * DAY); }
var INICIO = dIdx('2026-01-01');          // primeiro dia com dados no cubo

// Converte o resultado da consulta (linhas k, n, s) no cubo em memória
function parseCubo(rows) {
  var C = { m: [], k: {}, ref: null };
  for (var i = 0; i < 10; i++) C.m[i] = [];
  rows.forEach(function (r) {
    var k = r[0], s = r[2] || '';
    if (k === 'ref') { C.ref = s; return; }
    if (k.indexOf('k_') === 0) { C.k[k.slice(2)] = [''].concat(s.split('\t')); return; }
    var m = +k.slice(1);
    if (!s) return;
    C.m[m] = s.split(';').map(function (t) {
      var a = t.split('|');
      return { d: +a[0], x: a[1], r: a[2] ? +a[2] : 0, v: a[3] ? +a[3] : 0, b: a[4] ? +a[4] : 0, t: a[5] ? +a[5] : 0,
        q: a[6] === '' ? null : +a[6], a: a[7] === '' ? null : +a[7], imo: a[8], val: a[9] === '' ? 0 : +a[9] };
    });
  });
  return C;
}

function faixaArea(a) {
  if (a == null || a <= 0) return 'Sem informação';
  if (a < 80) return 'Até 80 m²';
  if (a < 120) return '80 a 120 m²';
  if (a < 160) return '120 a 160 m²';
  if (a < 220) return '160 a 220 m²';
  if (a < 300) return '220 a 300 m²';
  return '300 m² ou mais';
}
var AREA_ORD = ['Até 80 m²', '80 a 120 m²', '120 a 160 m²', '160 a 220 m²', '220 a 300 m²', '300 m² ou mais', 'Sem informação'];
function faixaDorm(q) { if (q == null || q <= 0) return 'Sem informação'; return q >= 4 ? '4 ou mais' : q + (q === 1 ? ' dormitório' : ' dormitórios'); }

var DIMS = [
  { k: 'cor', n: 'Corretor', f: function (C, e) { return C.k.cor[e.r] || 'Sem corretor'; } },
  { k: 'vei', n: 'Veículo de captação', f: function (C, e) { return normVei(C.k.vei[e.v]) || 'Sem informação'; }, semImovel: true },
  { k: 'bai', n: 'Bairro', f: function (C, e) { return C.k.bai[e.b] || 'Sem informação'; } },
  { k: 'cat', n: 'Tipologia', f: function (C, e) { return C.k.cat[e.t] || 'Sem informação'; } },
  { k: 'dor', n: 'Dormitórios', f: function (C, e) { return faixaDorm(e.q); } },
  { k: 'are', n: 'Área privativa', f: function (C, e) { return faixaArea(e.a); }, ord: AREA_ORD }
];
function dimBy(k) { for (var i = 0; i < DIMS.length; i++) if (DIMS[i].k === k) return DIMS[i]; }
// Une grafias diferentes do mesmo veículo
function normVei(s) {
  if (!s) return s;
  var l = s.toLowerCase();
  if (l === 'youtube') return 'YouTube';
  return s;
}

// F = {cor: id|0, vei: nome|''}
function passa(C, m, e, F) {
  if (F.cor && e.r !== F.cor) return false;
  if (F.vei) { if (m >= 8) return false; if (normVei(C.k.vei[e.v]) !== F.vei) return false; }
  return true;

  if (c === 'server_not_connected' || c === 'selection_required') estado('Conecte o BigQuery', 'Este painel lê os dados direto do BigQuery da CreativeImob. Adicione o conector “Google Cloud BigQuery” em claude.ai → Configurações → Conectores e abra o painel de novo.');
  else if (c === 'needs_reauth') estado('Reconecte o BigQuery', 'O acesso ao conector “Google Cloud BigQuery” expirou. Reconecte em claude.ai → Configurações → Conectores.');
  else if (c === 'approval_required' || c === 'not_in_manifest') estado('Permita o acesso aos dados', 'O painel precisa da sua autorização para consultar o BigQuery com a sua conta.', 'Permitir e carregar', function () { carregar(true); });
  else if (c === 'blocked_by_policy') estado('Acesso bloqueado', 'A política da sua organização não permite este conector para a sua conta. Fale com o administrador do claude.ai.');
  else if (c === 'tool_error') estado('O BigQuery recusou a consulta', esc(String(e.message || '').slice(0, 300)) + ' Verifique se sua conta tem acesso ao projeto vistaprocessos.', 'Tentar de novo', function () { carregar(true); });
  else estado('Não foi possível carregar os dados', 'O BigQuery não respondeu a tempo (' + esc(c || 'erro') + '). Tente de novo em instantes.', 'Tentar de novo', function () { carregar(true); });
}
async function carregar(forcar) {
  // Versão estática (GitHub Pages): window.__poloFonte devolve as linhas do cubo já decifradas
  if (window.__poloFonte) {
    if (!C) { carregando(); $('#filters').style.visibility = $('#presets').style.visibility = 'hidden'; }
    try {
      var res = await window.__poloFonte(forcar);
      if (!res) return;
      var portao = document.getElementById('portao'); if (portao) { portao.remove(); document.documentElement.style.overflow = ''; }
      $('#filters').style.visibility = $('#presets').style.visibility = '';
      aplicar({ rows: res.rows.map(function (r) { return { f: r.map(function (v) { return { v: v }; }) }; }) }, null);
      if (res.gerado) $('#stamp').textContent = 'Dados até ' + fmt.data(hojeIdx() - 1) + ' · gerados em ' + new Date(res.gerado).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      if (C) { $('#stamp').textContent = 'Falha ao atualizar; mostrando a última leitura.'; return; }
      estado('Não foi possível carregar', 'O arquivo de dados não respondeu. Confira a conexão e tente de novo.', 'Tentar de novo', function () { carregar(true); });
    }
    return;
  }
  if (!C) carregando();
  if (!MCP) MCP = await claude.use('mcp');
  if (!MCP) { estado('Abra no claude.ai', 'Este painel consulta o BigQuery com o conector do claude.ai e só carrega dados quando aberto lá, com sua conta conectada.'); return; }
  try {
    var r = await MCP.callTool(SRV, 'execute_sql_readonly', { projectId: 'vistaprocessos', query: SQL, timeoutMs: 90000 }, { cache: forcar ? { refresh: true, gcTime: 86400000 } : { staleTime: 300000, gcTime: 86400000 } });
    var p = await concluir(r.payload);
    aplicar(p, r.cache && r.cache.storedAt);
  } catch (e) {
    if (e && e.retryable && !carregar.tentou) { carregar.tentou = true; setTimeout(function () { carregar(forcar); }, (e.retryAfterMs || 1500) + Math.random() * 800); return; }
    if (C) { $('#stamp').textContent = 'Falha ao atualizar; mostrando a última leitura.'; return; }
    erro(e);
  }
}
if ($('#refresh')) $('#refresh').onclick = function () { carregar.tentou = false; $('#stamp').textContent = 'Atualizando…'; carregar(true); };
carregar(false);
